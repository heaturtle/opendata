<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel資料</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
    />

    <style>
      body {
        margin: 0;
        font-family: "Noto Sans TC", sans-serif;
        background: linear-gradient(
          180deg,
          #eef7ff 0%,
          #f8fbff 45%,
          #ffffff 100%
        );
        color: #2c3e50;
      }

      .page-wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 50px 20px 80px;
      }

      .page-title {
        text-align: center;
        margin-bottom: 10px;
        font-size: 2rem;
        font-weight: 800;
        color: #1f3b64;
        letter-spacing: 1px;
      }

      .page-subtitle {
        text-align: center;
        color: #6b7a90;
        margin-bottom: 35px;
        font-size: 1rem;
      }

      .filter-card {
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(45, 90, 160, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.7);
        margin-bottom: 30px;
      }

      .filter-label {
        display: block;
        font-size: 0.95rem;
        font-weight: 700;
        color: #365b8c;
        margin-bottom: 10px;
      }

      #city,
      #town {
        width: 100%;
        height: 50px;
        border-radius: 14px;
        border: 1px solid #d7e5f5;
        background: #fff;
        padding: 0 16px;
        font-size: 1rem;
        color: #2f3b4a;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.03);
        transition: all 0.2s ease;
      }

      #city:focus,
      #town:focus {
        outline: none;
        border-color: #63a4ff;
        box-shadow: 0 0 0 4px rgba(99, 164, 255, 0.18);
      }

      .table-card {
        background: #fff;
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 16px 35px rgba(30, 60, 120, 0.08);
      }

      .custom-table {
        width: 100%;
        margin-bottom: 0;
        border-collapse: collapse;
      }

      .custom-table thead {
        background: linear-gradient(135deg, #4facfe, #00c6fb);
      }

      .custom-table th {
        padding: 16px 18px;
        text-align: left;
        color: #fff;
        font-weight: 700;
        font-size: 0.95rem;
        letter-spacing: 0.5px;
        border: none;
        white-space: nowrap;
      }

      .custom-table td {
        padding: 16px 18px;
        border-bottom: 1px solid #edf2f7;
        vertical-align: top;
        font-size: 0.95rem;
        color: #334155;
        line-height: 1.7;
      }

      .custom-table tbody tr {
        transition: all 0.2s ease;
      }

      .custom-table tbody tr:nth-child(even) {
        background: #fafcff;
      }

      .custom-table tbody tr:hover {
        background: #eef7ff;
      }

      .custom-table tbody tr:last-child td {
        border-bottom: none;
      }

      .custom-table td:nth-child(1) {
        min-width: 180px;
        font-weight: 700;
        color: #1f3b64;
      }

      .custom-table td:nth-child(2) {
        max-width: 320px;
        color: #5b6778;
      }

      .custom-table td:nth-child(3) {
        min-width: 120px;
        font-family: monospace;
        color: #2563eb;
        font-weight: 600;
        white-space: nowrap;
      }

      .custom-table td:nth-child(4) {
        min-width: 220px;
      }

      .empty-text {
        text-align: center;
        padding: 30px 15px;
        color: #94a3b8;
        font-size: 1rem;
      }

      @media (max-width: 992px) {
        .page-wrap {
          padding: 35px 15px 60px;
        }

        .page-title {
          font-size: 1.7rem;
        }

        .table-card {
          overflow-x: auto;
        }

        .custom-table {
          min-width: 760px;
        }
      }

      @media (max-width: 576px) {
        .filter-card {
          padding: 18px;
          border-radius: 16px;
        }

        .page-title {
          font-size: 1.45rem;
        }

        .page-subtitle {
          font-size: 0.95rem;
          margin-bottom: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-wrap">
      <h1 class="page-title">全台旅館資料查詢</h1>
      <p class="page-subtitle">
        快速篩選城市，查看旅館名稱、簡介、電話與地址資訊
      </p>

      <div class="filter-card">
        <div class="row align-items-end g-3">
          <div class="col-12 col-md-6 col-lg-4">
            <label for="city" class="filter-label">選擇城市</label>
            <select name="" id="city">
              <option value="" disabled selected>- - - 請選擇城市 - - -</option>
            </select>
          </div>
          <div class="col-12 col-md-6 col-lg-4">
            <label for="town" class="filter-label">選擇鄉鎮市區</label>
            <select name="" id="town" disabled>
              <option value="" disabled selected>
                - - - 請選鄉鎮市區 - - -
              </option>
            </select>
          </div>
        </div>
      </div>

      <div class="table-card">
        <table class="table custom-table">
          <thead>
            <tr>
              <th>旅館名稱</th>
              <th>簡介</th>
              <th>電話</th>
              <th>地址</th>
            </tr>
          </thead>
          <tbody id="hoteltest">
            <tr>
              <td>測試飯店</td>
              <td>這是一間很棒的飯店</td>
              <td>(049) 2927101</td>
              <td>南投縣埔里鎮水頭里水頭路1號</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script
      src="https://code.jquery.com/jquery-4.0.0.min.js"
      integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
      crossorigin="anonymous"
    ></script>

    <script>
      let allHotels = [];
      let CityName;
      let SelectTown;

      let CityCountyData;
      $(function () {
        $.ajax({
          type: "GET",
          url: "/CityCountyData.json",
          dataType: "json",
          success: function (data) {
            CityCountyData = data;
            CityCountyData.forEach(function (item) {
              const SelectCity = `<option value="${item.CityName}">${item.CityName}</option>`;
              $("#city").append(SelectCity);
            });
          },
          error: function () {
            console.log("error");
          },
        });
        $("#city").change(function () {
          const CityName = $(this).val();

          CityCountyData.filter(function (item) {
            $("#town").empty();
            return item.CityName === CityName;
          })[0].AreaList.forEach(function (item) {
            const SelectTown = `<option value="${item.AreaName}">${item.AreaName}</option>`;

            $("#town").append(SelectTown);
          });

          //開啟鄉鎮市選單
          $("#town").prop("disabled", false);
        });

        $.ajax({
          type: "GET",
          url: "/js/HotelList.json",
          dataType: "json",
          success: showdata,
          error: function () {
            alert("無法抓取hotel.json");
          },
        });

        function showdata(apidata) {
          const Hotels = apidata.Hotels;
          allHotels = normalize(Hotels);
          renderTable(allHotels);

          $("#city").change(function () {
            const SelectCity = $(this).val();

            const result = allHotels.filter(function (item) {
              return item.City === SelectCity;
            });

            renderTable(result);
          });
          $("#town").change(function () {
            const SelectTown = $(this).val();

            const result = allHotels.filter(function (item) {
              return item.Town === SelectTown;
            });

            renderTable(result);
          });
        }

        function normalize(hotelsdata) {
          return hotelsdata.map(function (item) {
            const hotelname = (item.HotelName ?? "").trim();
            const description = (item.Description ?? "").trim();
            const telephones =
              item.Telephones?.[0]?.Tel?.trim() || "未提供電話";
            const hotelnum = (item.HotelLicenseNumber ?? "").trim();
            const city = (item.PostalAddress?.City ?? "").trim();
            const town = (item.PostalAddress?.Town ?? "").trim();
            const streetaddress = (
              item.PostalAddress?.StreetAddress ?? ""
            ).trim();

            return {
              HotelName: hotelname || "未提供旅館名稱",
              Description: description || "未提供簡介",
              Telephones: telephones,
              HotelLicenseNumber: hotelnum || "未提供旅館證號",
              City: city,
              Town: town,
              StreetAddress: streetaddress || "未提供旅館地址",
            };
          });
        }

        function renderTable(data) {
          const tbody = $("#hoteltest");
          tbody.empty();

          if (data.length === 0) {
            tbody.append(`
              <tr>
                <td colspan="4" class="empty-text">查無符合條件的旅館資料</td>
              </tr>
            `);
            return;
          }

          data.forEach(function (item) {
            const strHTML = `
              <tr>
                <td>${item.HotelName}</td>
                <td>${item.Description}</td>
                <td>${item.Telephones}</td>
                <td>${item.City}${item.Town}${item.StreetAddress}</td>
              </tr>
            `;
            tbody.append(strHTML);
          });
        }
      });
    </script>
  </body>
</html>
